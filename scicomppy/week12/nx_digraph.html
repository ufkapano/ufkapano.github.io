<h1>NetworkX - DiGraph</h1>

<p>https://networkx.org/documentation/stable/reference/classes/digraph.html

<h3>DIRECTED GRAPHS</h3>

<p>A <strong>directed graph</strong> (or <strong>digraph</strong>)
is a graph that has <strong>directed edges</strong> 
(ordered pairs of vertices).

<hr><pre>
import networkx as nx

G = nx.DiGraph()   # a directed graph
